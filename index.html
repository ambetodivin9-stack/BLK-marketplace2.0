<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BLK Marketplace</title>
<style>
:root {
  --bg: #ffffff;
  --text: #1a1a1a;
  --card-bg: #ffffff;
  --border: #dddddd;
  --accent: #E74C3C;
  --accent2: #FF8C00;
  --accent3: #2ECC71;
  --shadow: rgba(0,0,0,0.1);
  --input-bg: #f9f9f9;
}
body.dark {
  --bg: #121212;
  --text: #f0f0f0;
  --card-bg: #1e1e1e;
  --border: #333333;
  --accent: #ff6b6b;
  --accent2: #ffa94d;
  --accent3: #51cf66;
  --shadow: rgba(255,255,255,0.05);
  --input-bg: #2a2a2a;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:80px;-webkit-font-smoothing:antialiased;transition:background 0.3s, color 0.3s;}
.kente{height:6px;background:linear-gradient(90deg,#E74C3C 20%,#FF8C00 40%,#2ECC71 60%,#E74C3C 80%);position:fixed;top:0;left:0;right:0;z-index:9999;}
.btn{padding:14px;border:none;border-radius:14px;font-weight:700;cursor:pointer;width:100%;background:var(--accent);color:#fff;font-family:inherit;font-size:16px;transition:transform .15s ease, background .2s ease;position:relative;overflow:hidden;}
.btn:active{transform:scale(.96);}
.btn-primary{background:var(--accent);color:#fff;}
.btn-outline{background:transparent;border:2px solid var(--accent);color:var(--accent);}
.btn-sm{padding:6px 12px;font-size:12px;width:auto;}
.auth-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);padding:20px;}
.auth-card{max-width:400px;width:100%;background:var(--card-bg);border:1px solid var(--border);border-radius:32px;padding:36px 28px 28px;text-align:center;box-shadow:0 10px 30px var(--shadow);}
.auth-title{font-size:26px;font-weight:300;color:var(--text);margin-bottom:4px;}
.auth-title span{font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.auth-subtitle{font-size:14px;color:#666;margin-bottom:28px;}
.auth-input-group{margin-bottom:12px;}
.auth-input-group input{width:100%;padding:16px 18px;border:1px solid var(--border);border-radius:30px;font-size:15px;background:var(--input-bg);color:var(--text);font-family:inherit;outline:none;transition:border-color .2s;}
.auth-input-group input:focus{border-color:var(--accent);}
.auth-btn{width:100%;padding:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:30px;color:#fff;font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;}
#authError{color:var(--accent);font-size:14px;margin-top:8px;display:none;}
.app{display:none;max-width:600px;margin:0 auto;padding:80px 16px 100px;}
.app.active{display:block;}
.home-header{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.brand-logo-text{font-size:28px;font-weight:800;color:var(--text);}
.search-bar{display:flex;align-items:center;gap:10px;padding:14px 20px;border-radius:30px;background:var(--card-bg);border:2px solid var(--accent);box-shadow:0 4px 12px var(--shadow);position:relative;}
.search-bar input{flex:1;border:none;background:transparent;font-size:16px;outline:none;color:var(--text);}
.search-icon{width:20px;height:20px;color:var(--accent);}
.user-search-dropdown{position:absolute;top:100%;left:0;right:0;background:var(--card-bg);border:1px solid var(--border);border-radius:0 0 12px 12px;max-height:250px;overflow-y:auto;z-index:100;box-shadow:0 4px 12px var(--shadow);display:none;margin-top:5px;}
.user-search-dropdown.active{display:block;}
.user-search-item{display:flex;align-items:center;gap:10px;padding:10px 15px;cursor:pointer;border-bottom:1px solid var(--border);}
.user-search-item:last-child{border-bottom:none;}
.user-search-item:hover{background:var(--input-bg);}
.user-search-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-shrink:0;overflow:hidden;}
.user-search-avatar img{width:100%;height:100%;object-fit:cover;}
.user-search-info{flex:1;}
.user-search-name{font-weight:600;}
.user-search-flames{font-size:12px;color:var(--accent2);}
@keyframes flamePulse{0%{transform:scale(1);text-shadow:0 0 5px rgba(255,140,0,0.5);}50%{transform:scale(1.2);text-shadow:0 0 15px rgba(255,100,0,0.9);}100%{transform:scale(1);text-shadow:0 0 5px rgba(255,140,0,0.5);}}
.flame-animated{display:inline-block;animation:flamePulse 1.2s infinite;color:var(--accent2);font-weight:800;}
.articles-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:8px;}
.article-card{background:var(--card-bg);border-radius:16px;overflow:hidden;cursor:pointer;border:1px solid var(--border);transition:transform .15s ease, box-shadow .2s ease;}
.article-card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;}
.empty{text-align:center;color:#999;padding:20px;}
.tab-bar{position:fixed;bottom:14px;left:12px;right:12px;z-index:1000;display:none;}
.tab-bar.show{display:flex;}
.tab-slider{display:flex;justify-content:space-around;align-items:center;max-width:600px;margin:0 auto;position:relative;padding:10px 8px;width:100%;border-radius:32px;background:var(--card-bg);border:2px solid var(--accent);box-shadow:0 14px 34px var(--shadow);}
.tab-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;padding:4px 6px;cursor:pointer;position:relative;z-index:2;flex:1;}
.tab-label{font-size:10px;font-weight:600;color:#aaa;}
.tab-item.active .tab-label{color:var(--accent);font-weight:800;}
.profile-avatar-new{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:#fff;overflow:hidden;cursor:pointer;}
.profile-avatar-new img{width:100%;height:100%;object-fit:cover;}
.profile-header-new{display:flex;align-items:center;gap:16px;margin-bottom:24px;}
.follow-buttons{display:flex;gap:24px;justify-content:center;margin:20px 0;}
.follow-btn{display:flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;background:var(--input-bg);border:2px solid var(--border);transition:transform .2s, border-color .2s;cursor:pointer;}
.follow-btn:hover{transform:scale(1.1);border-color:var(--accent);}
.follow-btn svg{width:32px;height:32px;fill:var(--text);}
.online-dot{width:12px;height:12px;background:var(--accent3);border-radius:50%;display:inline-block;margin-left:6px;}
.page{display:none;}
.page.active{display:block;}
.alert{padding:12px;border-radius:12px;margin-bottom:12px;display:none;align-items:center;gap:8px;font-size:14px;}
.alert-success{background:#d4edda;color:#155724;}
.alert-error{background:#f8d7da;color:#721c24;}
.alert-info{background:#d1ecf1;color:#0c5460;}
.wallet-card{background:var(--card-bg);border:1px solid var(--border);border-radius:24px;padding:24px 20px 20px;margin-bottom:24px;box-shadow:0 8px 20px var(--shadow);}
.wallet-balance-new{font-size:32px;font-weight:900;color:var(--accent);}
.wallet-actions{display:flex;gap:10px;justify-content:center;}
.wallet-btn{flex:1;padding:12px 8px;border:none;border-radius:14px;font-weight:600;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--input-bg);color:var(--accent);position:relative;overflow:hidden;}
.wallet-btn-deposit{background:rgba(46,204,113,.1);color:var(--accent3);}
.wallet-btn-withdraw{background:rgba(231,76,60,.1);color:var(--accent);}
.wallet-btn-transfer{background:rgba(52,152,219,.1);color:#3498DB;}
.profile-stats-new{display:flex;gap:16px;justify-content:center;background:var(--card-bg);border:1px solid var(--border);border-radius:20px;padding:16px;margin-bottom:16px;}
.stat-number-new{font-size:22px;font-weight:800;color:var(--accent);}
.stat-label-new{font-size:11px;color:#999;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:2000;padding:20px;}
.modal-overlay.active{display:flex;}
.modal-content{max-width:400px;width:100%;background:var(--card-bg);border-radius:24px;overflow:hidden;position:relative;max-height:90vh;overflow-y:auto;}
</style>
</head>
<body>
<div class="kente"></div>

<!-- Page d'authentification -->

<!-- Barre d'onglets -->
<div class="tab-bar" id="tabs">
  <div class="tab-slider">
    <button class="tab-item active" data-tab="pageHome"><span class="tab-label">Accueil</span></button>
    <button class="tab-item" data-tab="pageShop"><span class="tab-label">Magasin</span></button>

<script>
// ===================== VARIABLES GLOBALES =====================
const BACKEND_URL = 'https://blk-marketplace2-0-1.onrender.com';
let authToken = localStorage.getItem('authToken') || null;
let currentUserId = localStorage.getItem('currentUserId') || null;
let currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
let allProducts = [];
let selectedCategory = 'all';
let activeConversationId = null;
const PLACEHOLDER_IMAGE = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect width="400" height="400" fill="#eee"/><text x="50%" y="50%" font-size="20" text-anchor="middle" fill="#999">BLK</text></svg>';

// ===================== UTILITAIRES =====================
function apiFetch(url, options = {}) {
  const headers = {
    'Content-Type': 'application/json',
    ...(authToken ? { 'Authorization': `Bearer ${authToken}` } : {}),
    ...options.headers
  };
  return fetch(BACKEND_URL + url, { ...options, headers });
}
function showAlert(message, type = 'success') {
  const box = document.getElementById('alertBox');
  if (!box) return;
  box.textContent = message;
  box.className = 'alert alert-' + (type === 'error' ? 'error' : type === 'info' ? 'info' : 'success');
  box.style.display = 'flex';
  clearTimeout(box._t);
  box._t = setTimeout(() => { box.style.display = 'none'; }, 4000);
}
function openModal(html) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay active';
  overlay.innerHTML = `<div class="modal-content">${html}</div>`;
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  return overlay;
}
function formatNumber(num) {
  if (num >= 1000000) return (num/1000000).toFixed(1) + 'M';
  if (num >= 1000) return (num/1000).toFixed(1) + 'k';
  return String(num);
}
function parseServerDate(val) {
  if (!val) return null;
  if (val._seconds) return new Date(val._seconds * 1000);
  if (val.seconds) return new Date(val.seconds * 1000);
  const d = new Date(val);
  return isNaN(d.getTime()) ? null : d;
}
function showSpinner(show) {
  const spinner = document.getElementById('spinnerOverlay');
  if (spinner) spinner.classList.toggle('active', show);
}

// ===================== THÈME =====================
function applyTheme(theme) {
  if (theme === 'dark') document.body.classList.add('dark');
  else document.body.classList.remove('dark');
  localStorage.setItem('theme', theme);
}
const savedTheme = localStorage.getItem('theme') || 'light';
applyTheme(savedTheme);

// ===================== AUTHENTIFICATION =====================
let isLoginMode = true;
function toggleAuthMode() {
  isLoginMode = !isLoginMode;
  const nameGroup = document.getElementById('nameGroup');
  const phoneGroup = document.getElementById('phoneGroup');
  if (nameGroup) nameGroup.style.display = isLoginMode ? 'none' : 'block';
  if (phoneGroup) phoneGroup.style.display = isLoginMode ? 'none' : 'block';
  document.getElementById('btnLogin').textContent = isLoginMode ? 'Se connecter' : "S'inscrire";
  document.getElementById('showLogin').className = isLoginMode ? 'btn btn-sm btn-primary' : 'btn btn-sm btn-outline';
  document.getElementById('showRegister').className = !isLoginMode ? 'btn btn-sm btn-primary' : 'btn btn-sm btn-outline';
  document.getElementById('authError').style.display = 'none';
}
document.getElementById('showLogin')?.addEventListener('click', () => { if (!isLoginMode) toggleAuthMode(); });
document.getElementById('showRegister')?.addEventListener('click', () => { if (isLoginMode) toggleAuthMode(); });
toggleAuthMode();

document.getElementById('authForm')?.addEventListener('submit', function(e) {
  e.preventDefault();
  const name = document.getElementById('loginName').value.trim();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const phone = document.getElementById('loginPhone').value.trim();
  const errorDiv = document.getElementById('authError');
  if (!email || !password || (!isLoginMode && (!name || !phone))) {
    errorDiv.style.display = 'block';
    errorDiv.textContent = 'Remplis tous les champs.';
    return;
  }
  errorDiv.style.display = 'none';
  const url = isLoginMode ? '/api/auth/login' : '/api/auth/register';
  const body = isLoginMode ? { email, password } : { name, email, password, phone };
  apiFetch(url, { method: 'POST', body: JSON.stringify(body) })
  .then(r => r.json())
  .then(data => {
    if (data.success) {
      localStorage.setItem('authToken', data.token);
      localStorage.setItem('currentUserId', data.userId);
      localStorage.setItem('currentUser', JSON.stringify(data.user));
      authToken = data.token;
      currentUserId = data.userId;
      currentUser = data.user;
      document.getElementById('authPage').style.display = 'none';
      document.getElementById('appContainer').classList.add('active');
      document.getElementById('tabs').classList.add('show');
      updateProfileUI(currentUser);
      loadProducts();
      loadWallet();
      loadFlames(currentUserId);
      initTabs();
      initUserSearch();
    } else {
      errorDiv.style.display = 'block';
      errorDiv.textContent = data.message || 'Erreur';
    }
  })
  .catch(err => {
    errorDiv.style.display = 'block';
    errorDiv.textContent = 'Erreur réseau : ' + err.message;
  });
});

// ===================== MISE À JOUR PROFIL =====================
function updateProfileUI(user) {
  const nameEl = document.getElementById('profileNameNew');
  const emailEl = document.getElementById('profileEmailNew');
  const phoneEl = document.getElementById('profilePhoneNew');
  const letterEl = document.getElementById('profileAvatarLetter');
  const imgEl = document.getElementById('profileAvatarImg');
  const onlineDotEl = document.getElementById('profileOnlineDot');

  if (nameEl) nameEl.textContent = user.name || 'Utilisateur';
  if (emailEl) emailEl.textContent = user.email || '';
  if (phoneEl) phoneEl.textContent = user.phone || '';
  if (letterEl) letterEl.textContent = (user.name || 'U').charAt(0).toUpperCase();

  if (imgEl) {
    if (user.photo) {
      imgEl.src = user.photo;
      imgEl.style.display = 'block';
      if (letterEl) letterEl.style.display = 'none';
    } else {
      imgEl.style.display = 'none';
      if (letterEl) letterEl.style.display = 'block';
    }
  }

  if (onlineDotEl) onlineDotEl.style.display = user.online ? 'inline-block' : 'none';
}

// ===================== CHARGEMENT PRODUITS =====================
function loadProducts() {
  apiFetch('/api/articles')
  .then(r => r.json())
  .then(data => {
    allProducts = (data.success && data.data) ? data.data : [];
    renderProducts();
  }).catch(() => { allProducts = []; renderProducts(); });
}
function renderProducts() {
  const grid = document.getElementById('productsGrid');
  const empty = document.getElementById('emptyHome');
  if (!grid) return;
  let filtered = allProducts || [];
  if (selectedCategory !== 'all') filtered = filtered.filter(p => p.category === selectedCategory);
  const q = document.getElementById('searchInput')?.value.toLowerCase() || '';
  if (q) filtered = filtered.filter(p => p.title && p.title.toLowerCase().includes(q));
  grid.innerHTML = '';
  if (filtered.length === 0) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  filtered.forEach(p => {
    const card = document.createElement('div');
    card.className = 'article-card';
    const imgSrc = p.image || (p.images && p.images[0]) || PLACEHOLDER_IMAGE;
    card.innerHTML = `<img src="${imgSrc}" alt="${p.title}">`;
    card.addEventListener('click', () => showProductModal(p));
    grid.appendChild(card);
  });
}
document.getElementById('searchInput')?.addEventListener('input', renderProducts);
document.querySelectorAll('#categoryFilters .btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('#categoryFilters .btn').forEach(b => b.className = 'btn btn-sm btn-outline');
    this.className = 'btn btn-sm btn-primary';
    selectedCategory = this.dataset.cat;
    renderProducts();
  });
});

// ===================== FICHE PRODUIT SIMPLE =====================
function showProductModal(product) {
  const html = `
    <div style="padding:20px;text-align:center;">
      <img src="${product.image || (product.images && product.images[0]) || PLACEHOLDER_IMAGE}" style="width:100%;max-height:300px;object-fit:cover;border-radius:12px;">
      <h3 style="margin:10px 0;">${product.title}</h3>
      <p style="color:var(--accent);font-weight:800;">${product.price} FCFA</p>
      <p style="color:#666;">${product.description || ''}</p>
      <p style="margin-top:10px;">Vendeur: ${product.sellerName || 'Anonyme'}</p>
      <button class="btn btn-primary" onclick="this.closest('.modal-overlay').remove()">Fermer</button>
    </div>
  `;
  openModal(html);
}

// ===================== RECHERCHE UTILISATEURS =====================
let userSearchTimeout;
function initUserSearch() {
  const input = document.getElementById('searchInput');
  const dropdown = document.getElementById('userSearchDropdown');
  if (!input || !dropdown) return;
  input.addEventListener('input', function() {
    clearTimeout(userSearchTimeout);
    const query = this.value.trim();
    if (query.length < 2) {
      dropdown.classList.remove('active');
      dropdown.innerHTML = '';
      return;
    }
    userSearchTimeout = setTimeout(() => {
      apiFetch('/api/users/search?query=' + encodeURIComponent(query))
        .then(r => r.json())
        .then(data => {
          if (data.success && data.data.length > 0) {
            dropdown.innerHTML = '';
            data.data.forEach(user => {
              const item = document.createElement('div');
              item.className = 'user-search-item';
              item.innerHTML = `
                <div class="user-search-avatar">${user.photo ? `<img src="${user.photo}">` : (user.name || '?').charAt(0).toUpperCase()}</div>
                <div class="user-search-info">
                  <div class="user-search-name">${user.name}</div>
                  <div class="user-search-flames">🔥 ${user.flames} flammes</div>
                </div>
              `;
              item.addEventListener('click', () => {
                dropdown.classList.remove('active');
                dropdown.innerHTML = '';
                input.value = '';
                showUserProfile(user);
              });
              dropdown.appendChild(item);
            });
            dropdown.classList.add('active');
          } else {
            dropdown.classList.remove('active');
            dropdown.innerHTML = '';
          }
        })
        .catch(err => { console.error(err); dropdown.classList.remove('active'); });
    }, 300);
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-bar')) {
      dropdown.classList.remove('active');
      dropdown.innerHTML = '';
    }
  });
}
function showUserProfile(user) {
  const html = `
    <div style="text-align:center;">
      <div style="width:80px;height:80px;margin:0 auto;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:#fff;overflow:hidden;">
        ${user.photo ? `<img src="${user.photo}" style="width:100%;height:100%;object-fit:cover;">` : (user.name || '?').charAt(0).toUpperCase()}
      </div>
      <h3 style="margin:10px 0 4px;">${user.name}</h3>
      <p style="color:#999;">🔥 ${user.flames} flammes</p>
      <button class="btn btn-primary" onclick="this.closest('.modal-overlay').remove()">Fermer</button>
    </div>
  `;
  openModal(html);
}

// ===================== WALLET =====================
function loadWallet() {
  if (!currentUserId) return;
  apiFetch('/api/wallet/' + currentUserId)
  .then(r => r.json())
  .then(data => {
    const bal = document.getElementById('walletBalanceNew');
    if (bal) bal.textContent = data.balance || 0;
  }).catch(() => {});
}

document.getElementById('btnDepositNew')?.addEventListener('click', () => openMoneyForm('deposit'));
document.getElementById('btnWithdrawNew')?.addEventListener('click', () => openMoneyForm('withdraw'));
document.getElementById('btnTransferNew')?.addEventListener('click', openTransferForm);

function openMoneyForm(kind) {
  const isDeposit = kind === 'deposit';
  let html = `<h3 style="text-align:center;margin-bottom:14px;">${isDeposit ? 'Déposer sur ton wallet' : 'Retirer de ton wallet'}</h3>`;
  html += `<div style="display:flex;gap:10px;margin-bottom:10px;">
    <button type="button" class="btn btn-sm money-op-btn" data-op="mtn" style="flex:1;">MTN</button>
    <button type="button" class="btn btn-sm btn-outline money-op-btn" data-op="airtel" style="flex:1;">Airtel</button>
  </div>`;
  html += `<input type="tel" id="moneyPhone" placeholder="Numéro Mobile Money" style="width:100%;padding:12px;margin-bottom:8px;border:1px solid var(--border);border-radius:10px;font-size:16px;background:var(--input-bg);color:var(--text);">`;
  html += `<input type="number" id="moneyAmount" placeholder="Montant (FCFA)" style="width:100%;padding:12px;margin-bottom:14px;border:1px solid var(--border);border-radius:10px;font-size:16px;background:var(--input-bg);color:var(--text);">`;
  html += `<button class="btn btn-primary" id="moneySubmit">${isDeposit ? 'Confirmer le dépôt' : 'Confirmer le retrait'}</button>`;
  html += `<button class="btn btn-outline" id="moneyCancel" style="margin-top:8px;">Annuler</button>`;
  html += `<div id="moneyStatus" style="margin-top:12px;font-size:13px;text-align:center;"></div>`;

  const overlay = openModal(html);
  let selectedOp = 'mtn';
  overlay.querySelectorAll('.money-op-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      overlay.querySelectorAll('.money-op-btn').forEach(b => b.className = 'btn btn-sm btn-outline money-op-btn');
      this.className = 'btn btn-sm money-op-btn';
      selectedOp = this.dataset.op;
    });
  });
  overlay.querySelector('#moneyCancel').addEventListener('click', () => overlay.remove());
  overlay.querySelector('#moneySubmit').addEventListener('click', function() {
    const phone = overlay.querySelector('#moneyPhone').value.trim();
    const amount = overlay.querySelector('#moneyAmount').value;
    const statusEl = overlay.querySelector('#moneyStatus');
    if (!phone || !amount || parseInt(amount) <= 0) {
      statusEl.style.color = '#E74C3C';
      statusEl.textContent = 'Renseigne un numéro et un montant valides.';
      return;
    }
    this.disabled = true;
    statusEl.style.color = '#999';
    statusEl.textContent = 'Traitement en cours...';

    if (isDeposit) {
      apiFetch('/api/payment/initiate', {
        method: 'POST',
        body: JSON.stringify({ amount: parseInt(amount), phone, operator: selectedOp })
      })
      .then(r => r.json())
      .then(data => {
        this.disabled = false;
        if (data.success) {
          statusEl.style.color = 'var(--accent3)';
          statusEl.textContent = data.status === 'succeeded' ? 'Dépôt confirmé !' : 'Confirme le code reçu par SMS/USSD.';
          loadWallet();
          if (data.status === 'succeeded') {
            showAlert('Dépôt réussi !', 'success');
            setTimeout(() => overlay.remove(), 1500);
          }
        } else {
          statusEl.style.color = '#E74C3C';
          statusEl.textContent = data.message || 'Le dépôt a échoué.';
        }
      })
      .catch(e => {
        this.disabled = false;
        statusEl.style.color = '#E74C3C';
        statusEl.textContent = 'Erreur réseau: ' + e.message;
      });
    } else {
      apiFetch('/api/wallet/withdraw', {
        method: 'POST',
        body: JSON.stringify({ amount: parseInt(amount), phone, operator: selectedOp })
      })
      .then(r => r.json())
      .then(data => {
        this.disabled = false;
        if (data.success) {
          statusEl.style.color = 'var(--accent3)';
          statusEl.textContent = data.message;
          loadWallet();
          showAlert('Retrait initié !', 'success');
          setTimeout(() => overlay.remove(), 1500);
        } else {
          statusEl.style.color = '#E74C3C';
          statusEl.textContent = data.message || 'Le retrait a échoué.';
        }
      })
      .catch(e => {
        this.disabled = false;
        statusEl.style.color = '#E74C3C';
        statusEl.textContent = 'Erreur réseau: ' + e.message;
      });
    }
  });
}

function openTransferForm() {
  let html = '<h3 style="margin-bottom:14px;text-align:center;">Transférer à un utilisateur BLK</h3>';
  html += '<input type="tel" id="transferPhone" placeholder="Numéro du destinataire" style="width:100%;padding:12px;margin-bottom:8px;border:1px solid var(--border);border-radius:10px;font-size:16px;background:var(--input-bg);color:var(--text);">';
  html += '<input type="number" id="transferAmount" placeholder="Montant (FCFA)" style="width:100%;padding:12px;margin-bottom:14px;border:1px solid var(--border);border-radius:10px;font-size:16px;background:var(--input-bg);color:var(--text);">';
  html += '<button class="btn btn-primary" id="transferSubmit">Envoyer</button>';
  html += '<button class="btn btn-outline" id="transferCancel" style="margin-top:8px;">Annuler</button>';
  html += '<div id="transferStatus" style="margin-top:12px;font-size:13px;text-align:center;"></div>';
  const overlay = openModal(html);
  overlay.querySelector('#transferCancel').addEventListener('click', () => overlay.remove());
  overlay.querySelector('#transferSubmit').addEventListener('click', function() {
    const toPhone = overlay.querySelector('#transferPhone').value.trim();
    const amount = overlay.querySelector('#transferAmount').value;
    const statusEl = overlay.querySelector('#transferStatus');
    if (!toPhone || !amount || parseInt(amount) <= 0) {
      statusEl.style.color = '#E74C3C';
      statusEl.textContent = 'Renseigne un numéro et un montant valides.';
      return;
    }
    this.disabled = true;
    apiFetch('/api/wallet/transfer', {
      method: 'POST',
      body: JSON.stringify({ toPhone, amount: parseInt(amount) })
    })
    .then(r => r.json())
    .then(data => {
      this.disabled = false;
      if (data.success) {
        statusEl.style.color = 'var(--accent3)';
        statusEl.textContent = data.message;
        loadWallet();
        setTimeout(() => overlay.remove(), 1500);
      } else {
        statusEl.style.color = '#E74C3C';
        statusEl.textContent = data.message || 'Transfert échoué.';
      }
    })
    .catch(e => {
      this.disabled = false;
      statusEl.style.color = '#E74C3C';
      statusEl.textContent = 'Erreur réseau: ' + e.message;
    });
  });
}

// ===================== UPLOAD PHOTO PROFIL =====================
document.getElementById('btnUploadPhoto')?.addEventListener('click', () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      showSpinner(true);
      apiFetch('/api/upload', { method: 'POST', body: JSON.stringify({ base64: ev.target.result }) })
        .then(r => r.json())
        .then(data => {
          if (data.success) {
            return apiFetch('/api/users/' + currentUserId, { method: 'PUT', body: JSON.stringify({ photo: data.url }) })
              .then(r => r.json())
              .then(updateData => {
                showSpinner(false);
                if (updateData.success) {
                  currentUser.photo = data.url;
                  localStorage.setItem('currentUser', JSON.stringify(currentUser));
                  updateProfileUI(currentUser);
                  showAlert('Photo mise à jour !');
                } else showAlert('Erreur mise à jour: ' + updateData.message, 'error');
              });
          } else {
            showSpinner(false);
            showAlert('Erreur upload: ' + data.message, 'error');
          }
        })
        .catch(e => {
          showSpinner(false);
          showAlert('Erreur réseau: ' + e.message, 'error');
        });
    };
    reader.readAsDataURL(file);
  };
  input.click();
});

// ===================== FLAMMES =====================
function loadFlames(userId) {
  if (!userId) return;
  apiFetch('/api/flames/' + userId)
  .then(r => r.json())
  .then(data => {
    const flamesEl = document.getElementById('profileFlamesNew');
    if (flamesEl) {
      flamesEl.textContent = data.flames || 0;
      flamesEl.classList.add('flame-animated');
    }
  }).catch(() => {});
}

// ===================== ONGLETS =====================
function initTabs() {
  const tabs = document.querySelectorAll('.tab-item');
  const pages = document.querySelectorAll('.page');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      pages.forEach(p => p.classList.remove('active'));
      const target = document.getElementById(tab.dataset.tab);
      if (target) target.classList.add('active');
      if (tab.dataset.tab === 'pageProfile') { loadWallet(); loadFlames(currentUserId); }
      if (tab.dataset.tab === 'pageShop') { loadShopArticles(); }
      if (tab.dataset.tab === 'pageOrders') { loadOrders(); }
      if (tab.dataset.tab === 'pageMessages') { loadMessages(); }
    });
  });
}

// ===================== MAGASIN (ARTICLES DU VENDEUR) =====================
function loadShopArticles() {
  if (!currentUserId) return;
  apiFetch('/api/articles/seller/' + currentUserId)
  .then(r => r.json())
  .then(data => {
    const container = document.getElementById('shopArticles');
    if (!container) return;
    if (!data.success || !data.data || data.data.length === 0) {
      container.innerHTML = '<p class="empty">Aucun article publié</p>';
      return;
    }
    container.innerHTML = data.data.map(a => `
      <div style="display:flex;align-items:center;gap:12px;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;">
        <img src="${a.image || PLACEHOLDER_IMAGE}" style="width:50px;height:50px;object-fit:cover;border-radius:8px;">
        <div style="flex:1;">
          <strong>${a.title}</strong><br>${a.price} FCFA · Stock: ${a.stock || 0}
        </div>
      </div>
    `).join('');
  }).catch(e => console.error(e));
}

// ===================== COMMANDES (vide pour l'instant) =====================
function loadOrders() {
  const container = document.getElementById('ordersList');
  if (container) container.innerHTML = '<p class="empty">Aucune commande</p>';
}

// ===================== MESSAGERIE (vide pour l'instant) =====================
function loadMessages() {
  const container = document.getElementById('contactsList');
  if (container) container.innerHTML = '<p class="empty">Aucune discussion</p>';
}

// ===================== BOUTONS THÈME & DÉCONNEXION =====================
document.getElementById('btnToggleTheme')?.addEventListener('click', () => {
  applyTheme(localStorage.getItem('theme') === 'dark' ? 'light' : 'dark');
});
document.getElementById('btnLogout')?.addEventListener('click', () => {
  localStorage.removeItem('authToken');
  localStorage.removeItem('currentUserId');
  localStorage.removeItem('currentUser');
  location.reload();
});

// ===================== DÉMARRAGE =====================
if (authToken && currentUserId) {
  currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
  document.getElementById('authPage').style.display = 'none';
  document.getElementById('appContainer').classList.add('active');
  document.getElementById('tabs').classList.add('show');
  updateProfileUI(currentUser);
  loadProducts();
  loadWallet();
  loadFlames(currentUserId);
  initTabs();
  initUserSearch();
} else {
  document.getElementById('authPage').style.display = 'flex';
}
</script>

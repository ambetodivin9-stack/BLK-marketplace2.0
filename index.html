// ===================== SPLASH & NAVIGATION =====================
function showSplash() {
  document.getElementById('splashScreen').classList.remove('hidden');
  setTimeout(() => {
    document.getElementById('splashScreen').classList.add('hidden');
    try {
      if (authToken && currentUserId) {
        document.getElementById('onboardingContainer').style.display = 'none';
        document.getElementById('authPage').classList.remove('active');
        document.getElementById('appContainer').classList.add('active');
        document.getElementById('tabs').classList.add('show');
        showMainApp();
      } else {
        document.getElementById('onboardingContainer').style.display = 'block';
        showOnboardingStep('onboardingLogo');
        setTimeout(() => showOnboardingStep('onboardingWarning'), 2000);
      }
    } catch (error) {
      console.error('Erreur dans showSplash:', error);
    }
  }, 1500);
}

function showMainApp() {
  try { updateProfileUI(currentUser); } catch(e) { console.error(e); }
  try { loadProducts(); } catch(e) { console.error(e); }
  try { loadWallet(); } catch(e) { console.error(e); }
  try { loadOrders(); } catch(e) { console.error(e); }
  try { loadMessages(); } catch(e) { console.error(e); }
  try { loadShopArticles(); } catch(e) { console.error(e); }
  try { loadStats(); } catch(e) { console.error(e); }
  try { loadFlames(currentUserId); } catch(e) { console.error(e); }
  try { initTabs(); } catch(e) { console.error(e); }
  try { initUserSearch(); } catch(e) { console.error(e); }
  try { startAutoRefresh(); } catch(e) { console.error(e); }
  try { startHeartbeat(); } catch(e) { console.error(e); }
  try {
    if (!localStorage.getItem('tabHelpShown')) showTabHelp();
  } catch(e) { console.error(e); }
}

// ===================== ONBOARDING =====================
function showOnboardingStep(stepId) {
  document.querySelectorAll('.onboarding-page').forEach(p => p.classList.remove('active'));
  document.getElementById(stepId).classList.add('active');
}

// ===================== AUTO-REFRESH =====================
function startAutoRefresh() {
  setInterval(() => {
    try {
      if (document.getElementById('pageHome').classList.contains('active')) loadProducts();
      if (document.getElementById('pageShop').classList.contains('active')) { loadShopArticles(); loadStats(); }
      if (document.getElementById('pageOrders').classList.contains('active')) loadOrders();
      if (document.getElementById('pageMessages').classList.contains('active')) loadMessages();
      if (document.getElementById('pageProfile').classList.contains('active')) { loadWallet(); loadFlames(currentUserId); }
    } catch(e) { console.error(e); }
  }, 10000);
}

// ===================== DÉMARRAGE =====================
document.getElementById('authPage').classList.remove('active');
document.getElementById('appContainer').classList.remove('active');
document.getElementById('tabs').classList.remove('show');
showSplash();
</script>

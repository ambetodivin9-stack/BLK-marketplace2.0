<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BLK Marketplace</title>
<style>
:root {
  --bg: #ffffff;
  --text: #1a1a1a;
  --card-bg: #ffffff;
  --border: #dddddd;
  --accent: #E74C3C;
  --accent2: #FF8C00;
  --accent3: #2ECC71;
  --shadow: rgba(0,0,0,0.1);
  --input-bg: #f9f9f9;
}
body.dark {
  --bg: #121212;
  --text: #f0f0f0;
  --card-bg: #1e1e1e;
  --border: #333333;
  --accent: #ff6b6b;
  --accent2: #ffa94d;
  --accent3: #51cf66;
  --shadow: rgba(255,255,255,0.05);
  --input-bg: #2a2a2a;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:70px;-webkit-font-smoothing:antialiased;transition:background 0.3s, color 0.3s;}
.kente{height:6px;background:linear-gradient(90deg,#E74C3C 20%,#FF8C00 40%,#2ECC71 60%,#E74C3C 80%);position:fixed;top:0;left:0;right:0;z-index:9999;}

/* Boutons génériques */
.btn{padding:12px;border:none;border-radius:14px;font-weight:700;cursor:pointer;width:100%;background:var(--accent);color:#fff;font-family:inherit;font-size:16px;transition:transform .15s ease, background .2s ease;position:relative;overflow:hidden;}
.btn:active{transform:scale(.96);}
.btn-primary{background:var(--accent);color:#fff;}
.btn-success{background:var(--accent3);color:#fff;}
.btn-danger{background:var(--accent);color:#fff;}
.btn-outline{background:transparent;border:2px solid var(--accent);color:var(--accent);}
.btn-outline:active{background:rgba(231,76,60,.1);}
.btn-sm{padding:6px 12px;font-size:12px;width:auto;}
.glass{background:var(--card-bg);border-radius:20px;padding:15px;margin-bottom:10px;border:1px solid var(--border);backdrop-filter:blur(10px);}
.empty{text-align:center;color:#999;padding:20px;}

/* Authentification */
.auth-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);padding:20px;}
.auth-card{max-width:400px;width:100%;background:var(--card-bg);border:1px solid var(--border);border-radius:32px;padding:36px 28px 28px;text-align:center;box-shadow:0 10px 30px var(--shadow);}
.auth-title{font-size:26px;font-weight:300;color:var(--text);margin-bottom:4px;}
.auth-title span{font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.auth-subtitle{font-size:14px;color:#666;margin-bottom:28px;}
.auth-input-group{margin-bottom:12px;}
.auth-input-group input{width:100%;padding:16px 18px;border:1px solid var(--border);border-radius:30px;font-size:15px;background:var(--input-bg);color:var(--text);font-family:inherit;outline:none;transition:border-color .2s;}
.auth-input-group input:focus{border-color:var(--accent);}
.auth-btn{width:100%;padding:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:30px;color:#fff;font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;}
#authError{color:var(--accent);font-size:14px;margin-top:8px;display:none;}

/* Application principale */
.app{display:none;max-width:600px;margin:0 auto;padding:70px 16px 20px;}
.app.active{display:block;}
.home-header{display:flex;flex-direction:column;gap:10px;margin-bottom:10px;}
.brand-row{display:flex;align-items:center;gap:8px;padding-left:4px;}
.brand-logo-text{font-size:28px;font-weight:800;color:var(--text);}
.search-bar{display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:30px;background:var(--card-bg);border:2px solid var(--accent);box-shadow:0 4px 12px var(--shadow);position:relative;}
.search-bar input{flex:1;border:none;background:transparent;font-size:16px;outline:none;color:var(--text);}
.search-icon{width:20px;height:20px;color:var(--accent);}

/* Dropdown recherche utilisateurs */
.user-search-dropdown{position:absolute;top:100%;left:0;right:0;background:var(--card-bg);border:1px solid var(--border);border-radius:0 0 12px 12px;max-height:250px;overflow-y:auto;z-index:100;box-shadow:0 4px 12px var(--shadow);display:none;margin-top:5px;}
.user-search-dropdown.active{display:block;}
.user-search-item{display:flex;align-items:center;gap:10px;padding:10px 15px;cursor:pointer;border-bottom:1px solid var(--border);}
.user-search-item:last-child{border-bottom:none;}
.user-search-item:hover{background:var(--input-bg);}
.user-search-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-shrink:0;overflow:hidden;}
.user-search-avatar img{width:100%;height:100%;object-fit:cover;}
.user-search-info{flex:1;}
.user-search-name{font-weight:600;}
.user-search-flames{font-size:12px;color:var(--accent2);}

/* Animation flammes */
@keyframes flamePulse{0%{transform:scale(1);text-shadow:0 0 5px rgba(255,140,0,0.5);}50%{transform:scale(1.1);text-shadow:0 0 15px rgba(255,100,0,0.9);}100%{transform:scale(1);text-shadow:0 0 5px rgba(255,140,0,0.5);}}
.flame-animated{display:inline-block;animation:flamePulse 1.2s infinite;color:var(--accent2);font-weight:800;}

/* Grille articles */
.articles-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px;}
.article-card{background:var(--card-bg);border-radius:16px;overflow:hidden;cursor:pointer;border:1px solid var(--border);transition:transform .15s ease, box-shadow .2s ease;}
.article-card.tap-anim{transform:scale(.93);}
.article-card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;}

/* Stats magasin */
.shop-stats{padding:10px 0;margin-bottom:10px;}
.shop-stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.stat-card{background:var(--card-bg);border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px;border:1px solid var(--border);}
.stat-sales .stat-card-number{color:var(--accent);}
.stat-published .stat-card-number{color:var(--accent3);}
.stat-revenue .stat-card-number{color:var(--accent2);}
.stat-orders .stat-card-number{color:#3498DB;}
.stat-card-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:rgba(231,76,60,.1);border-radius:12px;flex-shrink:0;color:var(--accent);}
.stat-card-icon svg{width:20px;height:20px;}
.stat-card-content{display:flex;flex-direction:column;flex:1;min-width:0;}
.stat-card-number{font-size:20px;font-weight:800;}
.stat-card-label{font-size:11px;color:#999;margin-top:2px;}

/* Tab bar */
.tab-bar{position:fixed;bottom:10px;left:10px;right:10px;z-index:1000;display:none;}
.tab-bar.show{display:flex;}
.tab-slider{display:flex;justify-content:space-around;align-items:center;max-width:600px;margin:0 auto;position:relative;padding:8px 6px;width:100%;border-radius:32px;background:var(--card-bg);border:2px solid var(--accent);box-shadow:0 14px 34px var(--shadow);}
.tab-bubble{position:absolute;top:-24px;left:0;width:48px;height:48px;border-radius:50%;background:var(--accent);box-shadow:0 10px 20px rgba(231,76,60,.4),0 0 0 4px rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;transition:transform .4s cubic-bezier(.34,1.56,.64,1);z-index:3;pointer-events:none;}
.tab-bubble-icon{width:22px;height:22px;color:#fff;}
.tab-bubble-icon svg{width:100%;height:100%;}
.tab-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;padding:4px 4px;cursor:pointer;position:relative;z-index:2;flex:1;}
.tab-icon-svg{width:22px;height:22px;color:#aaa;}
.tab-icon-svg svg{width:100%;height:100%;}
.tab-label{font-size:10px;font-weight:600;color:#aaa;}
.tab-item.active .tab-icon-svg{opacity:0;}
.tab-item.active .tab-label{color:var(--accent);font-weight:800;}

/* Wallet */
.wallet-card{background:var(--card-bg);border:1px solid var(--border);border-radius:24px;padding:20px;margin-bottom:20px;box-shadow:0 8px 20px var(--shadow);}
.wallet-balance-new{font-size:32px;font-weight:900;color:var(--accent);}
.wallet-actions{display:flex;gap:10px;justify-content:center;}
.wallet-btn{flex:1;padding:10px 6px;border:none;border-radius:14px;font-weight:600;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--input-bg);color:var(--accent);position:relative;overflow:hidden;}
.wallet-btn-deposit{background:rgba(46,204,113,.1);color:var(--accent3);}
.wallet-btn-withdraw{background:rgba(231,76,60,.1);color:var(--accent);}
.wallet-btn-transfer{background:rgba(52,152,219,.1);color:#3498DB;}

/* Profil */
.profile-header-new{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.profile-avatar-new{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff;overflow:hidden;}
.profile-stats-new{display:flex;gap:16px;justify-content:center;background:var(--card-bg);border:1px solid var(--border);border-radius:20px;padding:14px;margin-bottom:14px;}
.stat-number-new{font-size:20px;font-weight:800;color:var(--accent);}
.stat-label-new{font-size:11px;color:#999;}

/* Boutons réseaux sociaux */
.follow-buttons{display:flex;gap:20px;justify-content:center;margin:16px 0;}
.follow-btn{display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:var(--input-bg);border:2px solid var(--border);transition:transform .2s, border-color .2s;cursor:pointer;}
.follow-btn:hover{transform:scale(1.1);border-color:var(--accent);}
.follow-btn svg{width:28px;height:28px;fill:var(--text);}

/* Point vert en ligne */
.online-dot{width:10px;height:10px;background:var(--accent3);border-radius:50%;display:inline-block;margin-left:6px;}

/* Pages */
.page{display:none;min-height:calc(100vh - 160px);}
.page.active{display:block;}

/* Alertes */
.alert{padding:10px;border-radius:12px;margin-bottom:10px;display:none;align-items:center;gap:8px;font-size:14px;}
.alert-success{background:#d4edda;color:#155724;}
.alert-error{background:#f8d7da;color:#721c24;}
.alert-info{background:#d1ecf1;color:#0c5460;}

/* Messagerie */
.contact-row{display:flex;align-items:center;gap:12px;padding:12px 8px;border-bottom:1px solid var(--border);cursor:pointer;}
.contact-row.active{background:rgba(231,76,60,.1);}
.contact-row-avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff;font-weight:800;flex-shrink:0;}
.contact-row-avatar img{width:100%;height:100%;object-fit:cover;}
.contact-row-info{flex:1;min-width:0;}
.contact-row-name{font-weight:700;font-size:15px;}
.contact-row-preview{font-size:13px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.contact-row-badge{background:var(--accent3);color:#fff;border-radius:50%;min-width:18px;height:18px;padding:0 5px;font-size:11px;display:flex;align-items:center;justify-content:center;}
.chat-header{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card-bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;}
.chat-back-btn{background:none;border:none;font-size:22px;cursor:pointer;color:var(--accent);}
.chat-contact-info{flex:1;display:flex;align-items:center;gap:10px;}
.chat-contact-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;overflow:hidden;}
.chat-contact-avatar img{width:100%;height:100%;object-fit:cover;}
.chat-contact-name{font-weight:700;}
.chat-messages{flex:1;overflow-y:auto;padding:16px;background:var(--bg);min-height:300px;max-height:calc(100vh - 250px);}
.message-row{display:flex;margin-bottom:10px;}
.message-row.mine{justify-content:flex-end;}
.message-bubble{max-width:75%;padding:10px 14px;border-radius:18px;background:var(--card-bg);box-shadow:0 1px 2px var(--shadow);font-size:14px;position:relative;border:1px solid var(--border);}
.message-row.mine .message-bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px;border:none;}
.message-row.other .message-bubble{background:var(--card-bg);border-bottom-left-radius:4px;}
.message-time{display:block;font-size:10px;opacity:.6;margin-top:2px;text-align:right;}
.chat-input-bar{display:flex;align-items:center;gap:8px;padding:10px;background:var(--card-bg);border-top:1px solid var(--border);position:sticky;bottom:0;}
.chat-input-bar input[type="text"]{flex:1;padding:10px;border:1px solid var(--border);border-radius:20px;font-size:15px;background:var(--input-bg);color:var(--text);}
.chat-send-btn{background:var(--accent);border:none;border-radius:50%;width:40px;height:40px;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;}

/* Fiche produit - carrousel */
.carousel-container{position:relative;overflow:hidden;border-radius:16px;margin-bottom:12px;}
.carousel-track{display:flex;transition:transform .3s ease;}
.carousel-slide{min-width:100%;}
.carousel-slide img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;}
.carousel-dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px;}
.carousel-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5);cursor:pointer;}
.carousel-dot.active{background:var(--accent);}
.carousel-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.5);border:none;border-radius:50%;width:32px;height:32px;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;z-index:2;}
.carousel-btn.left{left:8px;}
.carousel-btn.right{right:8px;}

/* Formulaire publication */
.publish-field{margin-bottom:16px;}
.publish-field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#555;}
.publish-field input[type="text"],.publish-field input[type="number"],.publish-field textarea,.publish-field select{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;font-size:15px;background:var(--input-bg);color:var(--text);}
.publish-photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.publish-thumb{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--border);}
.publish-thumb img{width:100%;height:100%;object-fit:cover;}
.publish-thumb button{position:absolute;top:2px;right:2px;background:var(--accent);border:none;border-radius:50%;width:20px;height:20px;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.publish-add-btn{display:flex;align-items:center;justify-content:center;width:64px;height:64px;border:2px dashed var(--accent);border-radius:10px;background:var(--input-bg);cursor:pointer;color:var(--accent);font-size:24px;}

/* Modales - design compact */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:2000;padding:20px;}
.modal-overlay.active{display:flex;}
.modal-content{max-width:400px;width:100%;background:var(--card-bg);border-radius:20px;padding:20px;max-height:85vh;overflow-y:auto;box-shadow:0 10px 30px var(--shadow);}

/* Spinner */
.spinner-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:5000;}
.spinner-overlay.active{display:flex;}
.spinner{width:50px;height:50px;border:5px solid rgba(231,76,60,.3);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="kente"></div>

<!-- Page d'authentification -->
<div class="auth-page" id="authPage">
  <div class="auth-card">
    <div class="auth-title">Bienvenue sur <br><span>BLK Marketplace</span></div>
    <p class="auth-subtitle">Achetez et vendez des articles de mode.</p>
    <div id="authModeToggle" style="display:flex;gap:10px;margin-bottom:20px;">
      <button class="btn btn-sm btn-primary" id="showLogin">Connexion</button>
      <button class="btn btn-sm btn-outline" id="showRegister">Inscription</button>
    </div>
    <form id="authForm" autocomplete="off">
      <div class="auth-input-group" id="nameGroup" style="display:none;"><input type="text" id="loginName" placeholder="Nom complet"></div>
      <div class="auth-input-group" id="phoneGroup" style="display:none;"><input type="tel" id="loginPhone" placeholder="Numéro de téléphone"></div>
      <div class="auth-input-group"><input type="email" id="loginEmail" placeholder="Adresse e-mail" required></div>
      <div class="auth-input-group"><input type="password" id="loginPassword" placeholder="Mot de passe" required></div>
      <button type="submit" class="auth-btn" id="btnLogin">Se connecter</button>
    </form>
    <div id="authError"></div>
  </div>
</div>

<!-- Application principale -->
<div class="app" id="appContainer">
  <div id="alertBox" class="alert"></div>

  <!-- Page Accueil -->
  <div class="page active" id="pageHome">
    <div class="home-header">
      <div class="brand-row"><span class="brand-logo-text">BLK</span></div>
      <div class="search-bar" id="searchBarContainer">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Rechercher un article ou un vendeur..." autocomplete="off">
        <div class="user-search-dropdown" id="userSearchDropdown"></div>
      </div>
    </div>
    <div id="categoryFilters" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
      <button class="btn btn-sm btn-primary" data-cat="all">Tous</button>
      <button class="btn btn-sm btn-outline" data-cat="robes">Robes</button>
      <button class="btn btn-sm btn-outline" data-cat="hauts">Hauts</button>
      <button class="btn btn-sm btn-outline" data-cat="bas">Bas</button>
      <button class="btn btn-sm btn-outline" data-cat="chaussures">Chaussures</button>
      <button class="btn btn-sm btn-outline" data-cat="sacs">Sacs</button>
      <button class="btn btn-sm btn-outline" data-cat="bijoux">Bijoux</button>
      <button class="btn btn-sm btn-outline" data-cat="accessoires">Accessoires</button>
    </div>
    <div id="productsGrid" class="articles-grid"></div>
    <div id="emptyHome" class="empty" style="display:none;">Aucun article</div>
  </div>

  <!-- Page Magasin -->
  <div class="page" id="pageShop">
    <h2 style="color:var(--accent);margin-bottom:8px;">Mon Magasin</h2>
    <button class="btn btn-primary" id="btnPublish" style="margin-bottom:16px;">Publier un article</button>
    <div class="shop-stats"><div class="shop-stats-grid">
      <div class="stat-card stat-sales">
        <div class="stat-card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8l9-4.5L21 8v8l-9 4.5L3 16Z"/><path d="M3 8l9 4.5L21 8"/><path d="M12 12.5V21"/></svg></div>
        <div class="stat-card-content"><span class="stat-card-number" id="statTotalSales">0</span><span class="stat-card-label">Articles vendus</span></div>
      </div>
      <div class="stat-card stat-published">
        <div class="stat-card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V6a2 2 0 0 1 2-2h8l6 6v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 4v6h6"/></svg></div>
        <div class="stat-card-content"><span class="stat-card-number" id="statTotalArticles">0</span><span class="stat-card-label">Articles publiés</span></div>
      </div>
      <div class="stat-card stat-revenue">
        <div class="stat-card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v9"/></svg></div>
        <div class="stat-card-content"><span class="stat-card-number" id="statTotalRevenue">0</span><span class="stat-card-label">Chiffre d'affaires</span></div>
      </div>
      <div class="stat-card stat-orders">
        <div class="stat-card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/><path d="M2.5 3h2.5l2.3 11.4a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.6L21 7H6"/></svg></div>
        <div class="stat-card-content"><span class="stat-card-number" id="statTotalOrders">0</span><span class="stat-card-label">Commandes</span></div>
      </div>
    </div></div>
    <div id="shopArticles" style="margin-top:12px;"></div>
  </div>

  <!-- Page Messages -->
  <div class="page" id="pageMessages">
    <h2 style="color:var(--accent);">Messagerie</h2>
    <div id="contactsList" style="display:flex;flex-direction:column;margin-bottom:12px;"></div>
    <div id="discussionView" style="display:none;"></div>
    <div id="emptyMessages" class="empty" style="display:block;">Aucune discussion</div>
  </div>

  <!-- Page Commandes -->
  <div class="page" id="pageOrders">
    <h2 style="color:var(--accent);">Mes Commandes</h2>
    <div id="ordersList"></div>
    <div id="emptyOrders" class="empty" style="display:none;">Aucune commande</div>
  </div>

  <!-- Page Profil -->
  <div class="page" id="pageProfile">
    <div class="profile-header-new">

<script>
// ===================== ICONS SVG =====================
const TAB_ICONS = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>',
  shop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5h16v4"/><path d="M5 9v11h14V9"/></svg>',
  messages:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4V5Z"/></svg>',
  orders:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2"/></svg>',
  profile:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-4 4.5-6 7-6s6 2 7 6"/></svg>'
};

// ===================== GLOBAL VARS =====================
const BACKEND_URL = 'https://blk-marketplace2-0-1.onrender.com';
let authToken = localStorage.getItem('authToken') || null;
let currentUserId = localStorage.getItem('currentUserId') || null;
let currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
let allProducts = [];
let selectedCategory = 'all';
let activeConversationId = null;
const PLACEHOLDER_IMAGE = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect width="400" height="400" fill="#eee"/><text x="50%" y="50%" font-size="20" text-anchor="middle" fill="#999">BLK</text></svg>';

// ===================== UTILITAIRES =====================
function apiFetch(url, options = {}) {
  const headers = {
    'Content-Type': 'application/json',
    ...(authToken ? { 'Authorization': `Bearer ${authToken}` } : {}),
    ...options.headers
  };
  return fetch(BACKEND_URL + url, { ...options, headers });
}
function showAlert(message, type = 'success') {
  const box = document.getElementById('alertBox');
  if (!box) return;
  box.textContent = message;
  box.className = 'alert alert-' + (type === 'error' ? 'error' : type === 'info' ? 'info' : 'success');
  box.style.display = 'flex';
  clearTimeout(box._t);
  box._t = setTimeout(() => { box.style.display = 'none'; }, 4000);
}
function openModal(html) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay active';
  overlay.innerHTML = `<div class="modal-content">${html}</div>`;
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  return overlay;
}
function formatNumber(num) {
  if (num >= 1000000) return (num/1000000).toFixed(1) + 'M';
  if (num >= 1000) return (num/1000).toFixed(1) + 'k';
  return String(num);
}
function parseServerDate(val) {
  if (!val) return null;
  if (val._seconds) return new Date(val._seconds * 1000);
  if (val.seconds) return new Date(val.seconds * 1000);
  const d = new Date(val);
  return isNaN(d.getTime()) ? null : d;
}
function showSpinner(show) {
  const spinner = document.getElementById('spinnerOverlay');
  if (spinner) spinner.classList.toggle('active', show);
}

// ===================== THÈME =====================
function applyTheme(theme) {
  if (theme === 'dark') document.body.classList.add('dark');
  else document.body.classList.remove('dark');
  localStorage.setItem('theme', theme);
}
const savedTheme = localStorage.getItem('theme') || 'light';
applyTheme(savedTheme);

// ===================== AUTHENTIFICATION =====================
let isLoginMode = true;
function toggleAuthMode() {
  isLoginMode = !isLoginMode;
  const nameGroup = document.getElementById('nameGroup');
  const phoneGroup = document.getElementById('phoneGroup');
  if (nameGroup) nameGroup.style.display = isLoginMode ? 'none' : 'block';
  if (phoneGroup) phoneGroup.style.display = isLoginMode ? 'none' : 'block';
  document.getElementById('btnLogin').textContent = isLoginMode ? 'Se connecter' : "S'inscrire";
  document.getElementById('showLogin').className = isLoginMode ? 'btn btn-sm btn-primary' : 'btn btn-sm btn-outline';
  document.getElementById('showRegister').className = !isLoginMode ? 'btn btn-sm btn-primary' : 'btn btn-sm btn-outline';
  document.getElementById('authError').style.display = 'none';
}
document.getElementById('showLogin')?.addEventListener('click', () => { if (!isLoginMode) toggleAuthMode(); });
document.getElementById('showRegister')?.addEventListener('click', () => { if (isLoginMode) toggleAuthMode(); });
toggleAuthMode();

document.getElementById('authForm')?.addEventListener('submit', function(e) {
  e.preventDefault();
  const name = document.getElementById('loginName').value.trim();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const phone = document.getElementById('loginPhone').value.trim();
  const errorDiv = document.getElementById('authError');
  if (!email || !password || (!isLoginMode && (!name || !phone))) {
    errorDiv.style.display = 'block';
    errorDiv.textContent = 'Remplis tous les champs.';
    return;
  }
  errorDiv.style.display = 'none';
  const url = isLoginMode ? '/api/auth/login' : '/api/auth/register';
  const body = isLoginMode ? { email, password } : { name, email, password, phone };
  apiFetch(url, { method: 'POST', body: JSON.stringify(body) })
  .then(r => r.json())
  .then(data => {
    if (data.success) {
      localStorage.setItem('authToken', data.token);
      localStorage.setItem('currentUserId', data.userId);
      localStorage.setItem('currentUser', JSON.stringify(data.user));
      authToken = data.token;
      currentUserId = data.userId;
      currentUser = data.user;
      document.getElementById('authPage').style.display = 'none';
      document.getElementById('appContainer').classList.add('active');
      document.getElementById('tabs').classList.add('show');
      updateProfileUI(currentUser);
      loadProducts();
      loadWallet();
      loadFlames(currentUserId);
      initTabs();
      initUserSearch();
      loadStats();
      loadMessages();
      loadOrders();
    } else {
      errorDiv.style.display = 'block';
      errorDiv.textContent = data.message || 'Erreur';
    }
  })
  .catch(err => {
    errorDiv.style.display = 'block';
    errorDiv.textContent = 'Erreur réseau : ' + err.message;
  });
});

// ===================== MISE À JOUR PROFIL =====================
function updateProfileUI(user) {
  const nameEl = document.getElementById('profileNameNew');
  const emailEl = document.getElementById('profileEmailNew');
  const phoneEl = document.getElementById('profilePhoneNew');
  const letterEl = document.getElementById('profileAvatarLetter');
  const onlineDotEl = document.getElementById('profileOnlineDot');

  if (nameEl) nameEl.textContent = user.name || 'Utilisateur';
  if (emailEl) emailEl.textContent = user.email || '';
  if (phoneEl) phoneEl.textContent = user.phone || '';
  if (letterEl) letterEl.textContent = (user.name || 'U').charAt(0).toUpperCase();
  if (onlineDotEl) onlineDotEl.style.display = user.online ? 'inline-block' : 'none';
}

// ===================== CHARGEMENT PRODUITS =====================
function loadProducts() {
  apiFetch('/api/articles')
  .then(r => r.json())
  .then(data => {
    allProducts = (data.success && data.data) ? data.data : [];
    renderProducts();
  }).catch(() => { allProducts = []; renderProducts(); });
}
function renderProducts() {
  const grid = document.getElementById('productsGrid');
  const empty = document.getElementById('emptyHome');
  if (!grid) return;
  let filtered = allProducts || [];
  if (selectedCategory !== 'all') filtered = filtered.filter(p => p.category === selectedCategory);
  const q = document.getElementById('searchInput')?.value.toLowerCase() || '';
  if (q) filtered = filtered.filter(p => p.title && p.title.toLowerCase().includes(q));
  grid.innerHTML = '';
  if (filtered.length === 0) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  filtered.forEach(p => {
    const card = document.createElement('div');
    card.className = 'article-card';
    const imgSrc = p.image || (p.images && p.images[0]) || PLACEHOLDER_IMAGE;
    card.innerHTML = `<img src="${imgSrc}" alt="${p.title}">`;
    card.addEventListener('click', () => showProductModal(p));
    grid.appendChild(card);
  });
}
document.getElementById('searchInput')?.addEventListener('input', renderProducts);
document.querySelectorAll('#categoryFilters .btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('#categoryFilters .btn').forEach(b => b.className = 'btn btn-sm btn-outline');
    this.className = 'btn btn-sm btn-primary';
    selectedCategory = this.dataset.cat;
    renderProducts();
  });
});

// ===================== FICHE PRODUIT =====================
function showProductModal(product) {
  const images = (Array.isArray(product.images) && product.images.length > 0) ? product.images : [product.image].filter(Boolean);
  const html = `
    <div>
      <div class="carousel-container" id="carousel">
        <div class="carousel-track" id="carouselTrack">
          ${images.map(img => `<div class="carousel-slide"><img src="${img}" alt=""></div>`).join('')}
        </div>
        ${images.length > 1 ? `
          <button class="carousel-btn left" id="carouselLeft">‹</button>
          <button class="carousel-btn right" id="carouselRight">›</button>
          <div class="carousel-dots" id="carouselDots">
            ${images.map((_,i) => `<span class="carousel-dot ${i===0?'active':''}" data-index="${i}"></span>`).join('')}
          </div>
        ` : ''}
      </div>

      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
        <div>
          <h2 style="margin:0;">${product.title || 'Sans titre'}</h2>
          <p style="margin:4px 0 0;color:#999;">${product.category || ''} · ${product.condition || ''}</p>
        </div>
        <div style="text-align:right;">
          <span style="font-size:22px;font-weight:900;color:var(--accent);">${product.price || 0} FCFA</span>
        </div>
      </div>

      <div style="display:flex;gap:12px;margin-bottom:12px;font-size:13px;color:#555;">
        <span>Vues: ${product.views || 0}</span>
        <span>Favoris: ${product.favorites || 0}</span>
        <span>Stock: ${product.stock || 1}</span>
      </div>

      <div style="margin-bottom:12px;">
        <strong>DESCRIPTION</strong>
        <p style="margin:4px 0 0;color:#666;">${product.description || ''}</p>
      </div>

      ${product.hashtags && product.hashtags.length ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;">${product.hashtags.map(tag => `<span style="background:var(--input-bg);padding:4px 8px;border-radius:12px;font-size:12px;">#${tag}</span>`).join('')}</div>` : ''}

      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:12px;background:var(--input-bg);border-radius:12px;">
        <div class="profile-avatar-new" style="width:40px;height:40px;">${product.sellerName ? product.sellerName.charAt(0).toUpperCase() : '?'}</div>
        <div>
          <div style="font-weight:700;">${product.sellerName || 'Anonyme'}</div>
          <div style="font-size:12px;color:#999;">Vendeur</div>
        </div>
        <button class="btn btn-sm btn-outline" style="margin-left:auto;" id="btnMessageSeller" data-seller-id="${product.sellerId}" data-seller-name="${product.sellerName || 'Vendeur'}">Message</button>
      </div>

      <div style="display:flex;gap:10px;">
        <button class="btn btn-primary" style="flex:1;" id="btnBuyNow">Acheter maintenant</button>
      </div>
    </div>
  `;

  const overlay = openModal(html);
  if (images.length > 1) {
    let currentIndex = 0;
    const track = overlay.querySelector('#carouselTrack');
    const dots = overlay.querySelectorAll('.carousel-dot');
    function updateCarousel(index) {
      track.style.transform = `translateX(-${index * 100}%)`;
      dots.forEach((dot, i) => dot.classList.toggle('active', i === index));
      currentIndex = index;
    }
    overlay.querySelector('#carouselLeft').addEventListener('click', () => updateCarousel((currentIndex - 1 + images.length) % images.length));
    overlay.querySelector('#carouselRight').addEventListener('click', () => updateCarousel((currentIndex + 1) % images.length));
    dots.forEach(dot => dot.addEventListener('click', () => updateCarousel(parseInt(dot.dataset.index))));
  }
  overlay.querySelector('#btnBuyNow').addEventListener('click', () => {
    overlay.remove();
    showCheckoutModal(product);
  });
  overlay.querySelector('#btnMessageSeller').addEventListener('click', function() {
    overlay.remove();
    openDiscussion(this.dataset.sellerId, this.dataset.sellerName);
  });
}

// ===================== CHECKOUT =====================
function showCheckoutModal(product) {
  const buyerCommission = Math.round(product.price * 0.03);
  const total = product.price + buyerCommission;
  const html = `
    <div>
      <h3 style="text-align:center;margin-bottom:16px;">Passer commande</h3>

      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:12px;background:var(--input-bg);border-radius:12px;">
        <img src="${product.image || (product.images && product.images[0]) || PLACEHOLDER_IMAGE}" style="width:60px;height:60px;object-fit:cover;border-radius:10px;">
        <div>
          <div style="font-weight:700;">${product.title}</div>
          <div style="font-size:13px;color:#999;">Par ${product.sellerName || 'Vendeur'}</div>
          <div style="font-weight:800;color:var(--accent);">${product.price} FCFA</div>
        </div>
      </div>

      <div style="margin-bottom:16px;">
        <label style="font-weight:600;font-size:14px;">MODE DE PAIEMENT</label>
        <div style="display:flex;gap:10px;margin-top:8px;">
          <button class="btn btn-sm payment-method-btn active" data-method="mtn" style="flex:1;">MTN Mobile Money</button>
          <button class="btn btn-sm payment-method-btn" data-method="airtel" style="flex:1;">Airtel Money</button>
        </div>
      </div>

      <div style="margin-bottom:16px;">
        <label style="font-weight:600;font-size:14px;">TON NUMÉRO MOBILE MONEY</label>
        <input type="tel" id="checkoutPhone" placeholder="Ex: 065918166" style="width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;margin-top:6px;font-size:15px;background:var(--input-bg);color:var(--text);">
      </div>

      <div style="background:var(--input-bg);border-radius:12px;padding:12px;margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span>Article</span><span>${product.price} FCFA</span></div>
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span>Commission BLK (3%)</span><span>${buyerCommission} FCFA</span></div>
        <hr style="border:none;border-top:1px solid var(--border);margin:8px 0;">
        <div style="display:flex;justify-content:space-between;font-weight:800;"><span>Total à payer</span><span style="color:var(--accent);">${total} FCFA</span></div>
        <div style="margin-top:8px;font-size:12px;color:var(--accent3);">Protection BLK incluse - remboursé si non reçu</div>
      </div>

      <button class="btn btn-primary" id="confirmPaymentBtn">Confirmer le paiement</button>
      <button class="btn btn-outline" id="cancelCheckoutBtn" style="margin-top:8px;">Annuler</button>
      <div id="checkoutStatus" style="margin-top:10px;font-size:13px;text-align:center;"></div>
    </div>
  `;

  const overlay = openModal(html);
  let selectedMethod = 'mtn';
  overlay.querySelectorAll('.payment-method-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      overlay.querySelectorAll('.payment-method-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      selectedMethod = this.dataset.method;
    });
  });
  overlay.querySelector('#cancelCheckoutBtn').addEventListener('click', () => overlay.remove());
  overlay.querySelector('#confirmPaymentBtn').addEventListener('click', function() {
    const phone = overlay.querySelector('#checkoutPhone').value.trim();
    const statusEl = overlay.querySelector('#checkoutStatus');

        urls.forEach((url, idx) => { if (!url) urls[idx] = PLACEHOLDER_IMAGE; });
        apiFetch('/api/articles', {

          statusEl.style.color = '#E74C3C';
          statusEl.textContent = 'Erreur réseau: ' + e.message;
        });
        return;

      statusEl.textContent = `Upload photo ${i+1}/${photos.length}...`;

      apiFetch('/api/upload', { method: 'POST', body: JSON.stringify({ base64: base64Pure }) })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          urls.push(data.url);
        } else {
          urls.push(null);
        }
        i++;
        uploadNext();
      })
      .catch(e => {
        urls.push(null);
        i++;
        uploadNext();
      });
    }
    uploadNext();
  });
});

// ===================== COMPRESSION IMAGE =====================
function compressImage(file, maxWidth, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let width = img.width;
        let height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const compressed = canvas.toDataURL('image/jpeg', quality);
        resolve(compressed);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ===================== MESSAGERIE =====================
function loadMessages() {
  if (!currentUserId) return;
  apiFetch('/api/messages/' + currentUserId)
    .then(r => r.json())
    .then(data => {
      const container = document.getElementById('contactsList');
      const empty = document.getElementById('emptyMessages');
      const view = document.getElementById('discussionView');

      if (!activeConversationId) {
        view.style.display = 'none';
        container.style.display = 'flex';
      }

      if (!data.success || !data.data || data.data.length === 0) {
        container.innerHTML = '';
        if (!activeConversationId) {
          empty.style.display = 'block';
        } else {
          empty.style.display = 'none';
        }
        return;
      }

      empty.style.display = 'none';

      let contacts = {};
      data.data.forEach(msg => {
        const otherId = msg.senderId === currentUserId ? msg.receiverId : msg.senderId;
        const otherName = msg.senderId === currentUserId ? msg.receiverName : msg.senderName;
        const preview = msg.text || '';
        if (!contacts[otherId]) {
          contacts[otherId] = {
            name: otherName || 'Utilisateur',
            lastMessage: preview,
            time: msg.createdAt,
            unread: (msg.receiverId === currentUserId && !msg.read) ? 1 : 0,
            photo: msg.senderId === currentUserId ? msg.receiverPhoto : msg.senderPhoto
          };
        } else {
          if (msg.receiverId === currentUserId && !msg.read) contacts[otherId].unread++;
          const existingTime = parseServerDate(contacts[otherId].time);
          const msgTime = parseServerDate(msg.createdAt);
          if (msgTime && (!existingTime || msgTime > existingTime)) {
            contacts[otherId].lastMessage = preview;
            contacts[otherId].time = msg.createdAt;
          }
        }
      });

      let keys = Object.keys(contacts);
      keys.sort((a, b) => (parseServerDate(contacts[b].time) || 0) - (parseServerDate(contacts[a].time) || 0));

      container.innerHTML = keys.map(id => {
        const c = contacts[id];
        const isActive = (activeConversationId === id) ? 'active' : '';
        const unreadBadge = c.unread > 0 ? `<span class="contact-row-badge">${c.unread}</span>` : '';
        const avatarHtml = c.photo ? `<img src="${c.photo}">` : `<span>${(c.name || 'U').charAt(0).toUpperCase()}</span>`;
        const d = parseServerDate(c.time);
        const timeStr = d ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
        return `
          <div class="contact-row ${isActive}" data-id="${id}">
            <div class="contact-row-avatar">${avatarHtml}</div>
            <div class="contact-row-info">
              <div class="contact-row-name">${c.name}</div>
              <div class="contact-row-preview">${c.lastMessage}</div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
              <span style="font-size:11px;color:#aaa;">${timeStr}</span>
              ${unreadBadge}
            </div>
          </div>
        `;
      }).join('');

      document.querySelectorAll('.contact-row').forEach(el => {
        el.addEventListener('click', function() {
          const contactId = this.dataset.id;
          const contactName = contacts[contactId]?.name || 'Contact';
          activeConversationId = contactId;
          document.querySelectorAll('.contact-row').forEach(c => c.classList.remove('active'));
          this.classList.add('active');
          openDiscussion(contactId, contactName);
        });
      });
    })
    .catch(e => {
      console.error('Erreur chargement messages:', e);
      document.getElementById('contactsList').innerHTML = '<p class="empty">Erreur de chargement</p>';
    });
}

function openDiscussion(contactId, contactName) {
  const view = document.getElementById('discussionView');
  const container = document.getElementById('contactsList');
  const empty = document.getElementById('emptyMessages');

  view.style.display = 'block';
  container.style.display = 'none';
  empty.style.display = 'none';
  activeConversationId = contactId;

  let contactAvatar = '';
  apiFetch('/api/users/' + contactId)
    .then(r => r.json())
    .then(data => {
      if (data.success) {
        contactAvatar = data.data.photo ? `<img src="${data.data.photo}" alt="">` : (data.data.name || '?').charAt(0).toUpperCase();
        updateDiscussionHeader(contactName, contactAvatar);
      } else {
        updateDiscussionHeader(contactName, contactName.charAt(0).toUpperCase());
      }
    })
    .catch(() => {
      updateDiscussionHeader(contactName, contactName.charAt(0).toUpperCase());
    });

  function updateDiscussionHeader(name, avatar) {
    view.innerHTML = `
      <div class="glass" style="padding:0;margin:0;border-radius:0;">
        <div class="chat-header">
          <button class="chat-back-btn" id="btnCloseDiscussion">‹</button>
          <div class="chat-contact-info">
            <div class="chat-contact-avatar">${avatar}</div>
            <div>
              <div class="chat-contact-name">${name}</div>
            </div>
          </div>
        </div>
        <div class="chat-messages" id="messagesList"></div>
        <div class="chat-input-bar">
          <input type="text" id="messageInput" placeholder="Écris ton message...">
          <button class="chat-send-btn" id="btnSendMessage">Envoyer</button>
        </div>
      </div>
    `;

    document.getElementById('btnCloseDiscussion').addEventListener('click', () => {
      view.style.display = 'none';
      container.style.display = 'flex';
      empty.style.display = 'none';
      activeConversationId = null;
      loadMessages();
    });

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || !activeConversationId) {
        showAlert('Message vide ou destinataire manquant', 'error');
        return;
      }
      input.value = '';
      sendMessagePayload({ receiverId: activeConversationId, text });
    }

    document.getElementById('btnSendMessage').addEventListener('click', sendMessage);
    document.getElementById('messageInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    loadConversation(contactId);
  }
}

function loadConversation(contactId) {
  if (!currentUserId || !contactId) return;
  apiFetch('/api/messages/' + currentUserId)
    .then(r => r.json())
    .then(data => {
      const container = document.getElementById('messagesList');
      if (!container || !data.success) return;
      const messages = data.data.filter(m => (m.senderId===currentUserId && m.receiverId===contactId) || (m.senderId===contactId && m.receiverId===currentUserId));
      messages.sort((a,b) => (parseServerDate(a.createdAt)||0)-(parseServerDate(b.createdAt)||0));
      if (messages.length===0) { container.innerHTML='<p class="empty">Aucun message</p>'; return; }
      container.innerHTML = messages.map(msg => {
        const isMine = msg.senderId===currentUserId;
        const d = parseServerDate(msg.createdAt);
        const timeStr = d ? d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
        return '<div class="message-row '+(isMine?'mine':'other')+'"><div class="message-bubble">'+msg.text+'<span class="message-time">'+timeStr+'</span></div></div>';
      }).join('');
      container.scrollTop = container.scrollHeight;
    })
    .catch(e => console.error(e));
}

function sendMessagePayload(payload) {
  apiFetch('/api/messages', { method:'POST', body: JSON.stringify(payload) })
    .then(r => r.json())
    .then(data => {
      if (data.success) {
        loadConversation(activeConversationId);
        loadMessages();
      } else {
        showAlert(data.message, 'error');
      }
    })
    .catch(e => showAlert('Erreur réseau: ' + e.message, 'error'));
}

    this.disabled = true;
    statusEl.style.color = '#999';
    statusEl.textContent = 'Traitement en cours...';
    if (isDeposit) {
      apiFetch('/api/payment/initiate', { method:'POST', body: JSON.stringify({ amount: parseInt(amount), phone, operator: selectedOp }) })
      .then(r => r.json())
      .then(data => {
        this.disabled = false;
        if (data.success) {
          statusEl.style.color = 'var(--accent3)';
          statusEl.textContent = data.status === 'succeeded' ? 'Dépôt confirmé !' : 'Confirme le code reçu par SMS/USSD.';
          loadWallet();
          if (data.status === 'succeeded') { showAlert('Dépôt réussi !', 'success'); setTimeout(() => overlay.remove(), 1500); }
        } else { statusEl.style.color = '#E74C3C'; statusEl.textContent = data.message || 'Le dépôt a échoué.'; }
      })
      .catch(e => { this.disabled=false; statusEl.style.color='#E74C3C'; statusEl.textContent='Erreur réseau: '+e.message; });
    } else {
      apiFetch('/api/wallet/withdraw', { method:'POST', body: JSON.stringify({ amount: parseInt(amount), phone, operator: selectedOp }) })
      .then(r => r.json())
      .then(data => {
        this.disabled = false;
        if (data.success) { statusEl.style.color = 'var(--accent3)'; statusEl.textContent = data.message; loadWallet(); showAlert('Retrait initié !', 'success'); setTimeout(() => overlay.remove(), 1500); }
        else { statusEl.style.color = '#E74C3C'; statusEl.textContent = data.message || 'Le retrait a échoué.'; }
      })
      .catch(e => { this.disabled=false; statusEl.style.color='#E74C3C'; statusEl.textContent='Erreur réseau: '+e.message; });
    }
  });
}

function openTransferForm() {
  let html = '<h3 style="margin-bottom:14px;text-align:center;">Transférer à un utilisateur BLK</h3>';
  html += '<input type="tel" id="transferPhone" placeholder="Numéro du destinataire" style="width:100%;padding:12px;margin-bottom:8px;border:1px solid var(--border);border-radius:10px;font-size:16px;background:var(--input-bg);color:var(--text);">';
  html += '<input type="number" id="transferAmount" placeholder="Montant (FCFA)" style="width:100%;padding:12px;margin-bottom:14px;border:1px solid var(--border);border-radius:10px;font-size:16px;background:var(--input-bg);color:var(--text);">';
  html += '<button class="btn btn-primary" id="transferSubmit">Envoyer</button>';
  html += '<button class="btn btn-outline" id="transferCancel" style="margin-top:8px;">Annuler</button>';
  html += '<div id="transferStatus" style="margin-top:12px;font-size:13px;text-align:center;"></div>';
  const overlay = openModal(html);
  overlay.querySelector('#transferCancel').addEventListener('click', () => overlay.remove());
  overlay.querySelector('#transferSubmit').addEventListener('click', function() {
    const toPhone = overlay.querySelector('#transferPhone').value.trim();
    const amount = overlay.querySelector('#transferAmount').value;
    const statusEl = overlay.querySelector('#transferStatus');
    if (!toPhone || !amount || parseInt(amount) <= 0) { statusEl.style.color='#E74C3C'; statusEl.textContent='Renseigne un numéro et un montant valides.'; return; }
    this.disabled = true;
    apiFetch('/api/wallet/transfer', { method:'POST', body: JSON.stringify({ toPhone, amount: parseInt(amount) }) })
    .then(r => r.json())
    .then(data => {
      this.disabled = false;
      if (data.success) { statusEl.style.color='var(--accent3)'; statusEl.textContent=data.message; loadWallet(); setTimeout(() => overlay.remove(), 1500); }
      else { statusEl.style.color='#E74C3C'; statusEl.textContent=data.message||'Transfert échoué.'; }
    })
    .catch(e => { this.disabled=false; statusEl.style.color='#E74C3C'; statusEl.textContent='Erreur réseau: '+e.message; });
  });
}

// ===================== FLAMMES =====================
function loadFlames(userId) {
  if (!userId) return;
  apiFetch('/api/flames/' + userId)
  .then(r => r.json())
  .then(data => {
    const flamesEl = document.getElementById('profileFlamesNew');
    if (flamesEl) {
      flamesEl.textContent = data.flames || 0;
      flamesEl.classList.add('flame-animated');
    }
  }).catch(() => {});
}

// ===================== ONGLETS =====================
function initTabs() {
  const tabs = document.querySelectorAll('.tab-item');
  const bubble = document.getElementById('tabBubble');
  const bubbleIcon = document.getElementById('tabBubbleIcon');
  tabs.forEach(tab => { tab.querySelector('.tab-icon-svg').innerHTML = TAB_ICONS[tab.dataset.icon] || ''; });
  function moveBubble(tab) {
    const tabRect = tab.getBoundingClientRect();
    const sliderRect = tab.parentElement.getBoundingClientRect();
    const center = (tabRect.left - sliderRect.left) + tabRect.width/2;
    bubble.style.transform = 'translateX(' + (center - 24) + 'px)';
    bubbleIcon.innerHTML = TAB_ICONS[tab.dataset.icon] || '';
  }
  function setActive(tab) {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    moveBubble(tab);
    const pageId = tab.dataset.tab;
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const target = document.getElementById(pageId);
    if (target) target.classList.add('active');
    if (pageId === 'pageProfile') { loadWallet(); loadFlames(currentUserId); }
    if (pageId === 'pageShop') { loadShopArticles(); loadStats(); }
    if (pageId === 'pageOrders') { loadOrders(); }
    if (pageId === 'pageMessages') { loadMessages(); }
  }
  tabs.forEach(tab => tab.addEventListener('click', () => setActive(tab)));
  const active = document.querySelector('.tab-item.active') || tabs[0];
  requestAnimationFrame(() => moveBubble(active));
  window.addEventListener('resize', () => moveBubble(document.querySelector('.tab-item.active')));
}

// ===================== MAGASIN =====================
function loadShopArticles() {
  if (!currentUserId) return;
  apiFetch('/api/articles/seller/' + currentUserId)
  .then(r => r.json())
  .then(data => {
    const container = document.getElementById('shopArticles');
    if (!container) return;
    if (!data.success || !data.data || data.data.length === 0) {
      container.innerHTML = '<p class="empty">Aucun article publié</p>';
      return;
    }
    container.innerHTML = '';
    data.data.forEach(a => {
      const div = document.createElement('div');
      div.style.cssText = 'display:flex;align-items:center;gap:12px;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;';
      let statusText = a.status === 'active' ? 'En vente' : (a.status === 'reserved' ? 'Réservé' : (a.status === 'sold' ? 'Vendu' : 'Inactif'));
      div.innerHTML = `
        <img src="${a.image || PLACEHOLDER_IMAGE}" style="width:50px;height:50px;object-fit:cover;border-radius:8px;">
        <div style="flex:1;">
          <strong>${a.title}</strong><br>
          ${a.price} FCFA · Stock: ${a.stock || 0}<br>
          <span style="font-size:11px;color:#999;">${statusText}</span>
        </div>
      `;
      if (a.status === 'active') {
        const delBtn = document.createElement('button');
        delBtn.className = 'btn btn-danger btn-sm';
        delBtn.style.cssText = 'width:auto;padding:6px 12px;';
        delBtn.textContent = 'Supprimer';
        delBtn.onclick = () => deleteArticle(a.id);
        div.appendChild(delBtn);
      }
      container.appendChild(div);
    });
  }).catch(e => console.error(e));
}

function deleteArticle(articleId) {
  if (!confirm('Supprimer cet article ?')) return;
  apiFetch('/api/articles/' + articleId, { method:'DELETE' })
  .then(r => r.json())
  .then(data => {
    if (data.success) { showAlert('Article supprimé !', 'success'); loadShopArticles(); loadProducts(); loadStats(); }
    else showAlert(data.message, 'error');
  }).catch(e => showAlert('Erreur: '+e.message, 'error'));
}

function loadStats() {
  if (!currentUserId) return;
  apiFetch('/api/stats/' + currentUserId)
  .then(r => r.json())
  .then(data => {
    if (data.success) {
      const s = data.data;
      document.getElementById('statTotalSales').textContent = s.totalSales || 0;
      document.getElementById('statTotalArticles').textContent = s.totalArticles || 0;
      document.getElementById('statTotalRevenue').textContent = formatNumber(s.totalRevenue || 0);
      document.getElementById('statTotalOrders').textContent = s.totalPurchases || 0;
    }
  }).catch(() => {});
}

// ===================== BOUTONS THÈME & DÉCONNEXION =====================
document.getElementById('btnToggleTheme')?.addEventListener('click', () => {
  applyTheme(localStorage.getItem('theme') === 'dark' ? 'light' : 'dark');
});
document.getElementById('btnLogout')?.addEventListener('click', () => {
  localStorage.removeItem('authToken');
  localStorage.removeItem('currentUserId');
  localStorage.removeItem('currentUser');
  location.reload();
});

// ===================== DÉMARRAGE =====================
if (authToken && currentUserId) {
  currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
  document.getElementById('authPage').style.display = 'none';
  document.getElementById('appContainer').classList.add('active');
  document.getElementById('tabs').classList.add('show');
  updateProfileUI(currentUser);
  loadProducts();
  loadWallet();
  loadFlames(currentUserId);
  initTabs();
  initUserSearch();
  loadStats();
  loadMessages();
  loadOrders();
} else {
  document.getElementById('authPage').style.display = 'flex';
}
</script>

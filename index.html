<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BLK Marketplace</title>
<style>
/* ===== STYLES COMPLETS (inchangés) ===== */
:root { --bg:#fff; --text:#1a1a1a; --card-bg:#fff; --border:#ddd; --accent:#E74C3C; --accent2:#FF8C00; --accent3:#2ECC71; --shadow:rgba(0,0,0,.1); --input-bg:#f9f9f9; }
body.dark { --bg:#121212; --text:#f0f0f0; --card-bg:#1e1e1e; --border:#333; --accent:#ff6b6b; --accent2:#ffa94d; --accent3:#51cf66; --shadow:rgba(255,255,255,0.05); --input-bg:#2a2a2a; }
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:70px;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;}
.kente{height:6px;background:linear-gradient(90deg,#E74C3C 20%,#FF8C00 40%,#2ECC71 60%,#E74C3C 80%);position:fixed;top:0;left:0;right:0;z-index:9999;}
.btn{padding:12px;border:none;border-radius:14px;font-weight:700;cursor:pointer;width:100%;background:var(--accent);color:#fff;font-size:16px;transition:transform .15s;position:relative;overflow:hidden;}
.btn:active{transform:scale(.96);}
.btn-primary{background:var(--accent);color:#fff;}
.btn-success{background:var(--accent3);color:#fff;}
.btn-danger{background:var(--accent);color:#fff;}
.btn-outline{background:transparent;border:2px solid var(--accent);color:var(--accent);}
.btn-sm{padding:6px 12px;font-size:12px;width:auto;}
.glass{background:var(--card-bg);border-radius:20px;padding:15px;margin-bottom:10px;border:1px solid var(--border);}
.empty{text-align:center;color:#999;padding:20px;}
/* Ajouts d'icônes SVG pour les onglets et stats */
.icon-inline{display:inline-flex;width:14px;height:14px;vertical-align:-2px;}
.icon-inline svg{width:100%;height:100%;}
/* ... (tous les styles déjà fournis précédemment) ... */
</style>
</head>
<body>
<div class="kente"></div>

<!-- Splash screen -->
<div class="splash-screen" id="splashScreen">
  <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><circle cx='90' cy='90' r='80' fill='white' opacity='0.9'/><text x='90' y='110' font-size='60' font-weight='bold' text-anchor='middle' fill='%23E74C3C'>BLK</text></svg>" alt="BLK" class="splash-logo" id="splashLogo">
  <div class="splash-title">BLK Marketplace</div>
</div>

<!-- Onboarding Container -->
<div id="onboardingContainer" style="display:none;">
  <div class="onboarding-page active" id="onboardingLogo">
    <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><circle cx='75' cy='75' r='70' fill='%23E74C3C'/><text x='75' y='90' font-size='45' font-weight='bold' text-anchor='middle' fill='white'>BLK</text></svg>" alt="BLK Marketplace" style="width:150px;height:150px;object-fit:contain;" id="onboardingLogoImg">
    <h1 style="margin-top:20px;">BLK Marketplace</h1>
  </div>
  <!-- Pages onboarding identiques à celles fournies précédemment -->
  <div class="onboarding-page" id="onboardingWarning"> ... </div>
  <div class="onboarding-page" id="onboardingPrivacy"> ... </div>
  <div class="onboarding-page" id="onboardingTerms"> ... </div>
  <div class="onboarding-page" id="onboardingFollow"> ... </div>
  <div class="onboarding-page" id="onboardingThanks"> ... </div>
</div>

<!-- Page d'authentification -->
<div class="auth-page" id="authPage">
  <!-- Contenu identique -->
</div>

<!-- Application principale -->
<div class="app" id="appContainer">
  <div id="alertBox" class="alert"></div>
  <!-- Pages Accueil, Magasin, Messages, Commandes, Profil avec contenu complet -->
</div>

<!-- Tab bar -->
<div class="tab-bar" id="tabs">
  <!-- Boutons onglets avec icônes SVG -->
</div>

<!-- Spinner -->
<div class="spinner-overlay" id="spinnerOverlay"><div class="spinner"></div></div>

<script>
// ===================== ICONS SVG =====================

// ===================== VARIABLES GLOBALES =====================
const BACKEND_URL = 'https://blk-marketplace2-0-1.onrender.com';
let authToken = localStorage.getItem('authToken') || null;
let currentUserId = localStorage.getItem('currentUserId') || null;
let currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');

// ===================== FONCTIONS UTILITAIRES =====================

function showAlert(message, type) { ... }

// Event listeners pour les boutons d'acceptation

// ===================== SPLASH & NAVIGATION =====================
function showSplash() {
  document.getElementById('splashScreen').classList.remove('hidden');
  setTimeout(() => {
    document.getElementById('splashScreen').classList.add('hidden');
    if (authToken && currentUserId) {
      document.getElementById('onboardingContainer').style.display = 'none';
      document.getElementById('authPage').classList.remove('active');
      document.getElementById('appContainer').classList.add('active');
      document.getElementById('tabs').classList.add('show');
      showMainApp();
    } else {
      document.getElementById('onboardingContainer').style.display = 'block';
      showOnboardingStep('onboardingLogo');
      setTimeout(() => showOnboardingStep('onboardingWarning'), 2000);
    }
  }, 1200);
}

function showMainApp() {
  updateProfileUI(currentUser);
  loadProducts();
  loadWallet();
  loadOrders();
  loadMessages();
  loadShopArticles();
  loadStats();
  loadFlames(currentUserId);
  initTabs();
  initUserSearch();
  startAutoRefresh();
  startHeartbeat();
  if (!localStorage.getItem('tabHelpShown')) showTabHelp();
}

// ===================== RECHERCHE UTILISATEURS =====================
function initUserSearch() { ... }
function showUserProfile(userId) { ... }

// ===================== AUTO-REFRESH =====================
function startAutoRefresh() {
  setInterval(() => {
    if (document.getElementById('pageHome').classList.contains('active')) loadProducts();
    if (document.getElementById('pageShop').classList.contains('active')) { loadShopArticles(); loadStats(); }
    if (document.getElementById('pageOrders').classList.contains('active')) loadOrders();
    if (document.getElementById('pageMessages').classList.contains('active')) loadMessages();
    if (document.getElementById('pageProfile').classList.contains('active')) { loadWallet(); loadFlames(currentUserId); }
  }, 10000);
}

// ===================== DÉMARRAGE =====================
document.getElementById('authPage').classList.remove('active');
document.getElementById('appContainer').classList.remove('active');
document.getElementById('tabs').classList.remove('show');
showSplash();
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Test Auth BLK</title>
  <style>
    body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f5f5f5; }
    .auth-box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
    input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; }
    button { width: 100%; padding: 12px; background: #E74C3C; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="authPage" class="auth-box">
    <h2>Connexion / Inscription</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Mot de passe">
    <button onclick="login()">Se connecter</button>
    <button onclick="register()">S'inscrire</button>
  </div>

  <div id="app" class="hidden">
    <h1>Bienvenue sur BLK</h1>
    <button onclick="logout()">Déconnexion</button>
  </div>

<script>
  const BACKEND_URL = 'https://blk-marketplace2-0-1.onrender.com';
  let authToken = localStorage.getItem('authToken') || null;

  // Si déjà connecté, on affiche l'app
  if (authToken) {
    document.getElementById('authPage').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
  }

  async function login() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const res = await fetch(BACKEND_URL + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (data.success) {
      localStorage.setItem('authToken', data.token);
      localStorage.setItem('currentUserId', data.userId);
      localStorage.setItem('currentUser', JSON.stringify(data.user));
      location.reload();
    } else {
      alert(data.message);
    }
  }

  async function register() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const name = prompt("Ton nom complet :");
    const phone = prompt("Ton numéro de téléphone :");
    const res = await fetch(BACKEND_URL + '/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, name, phone })
    });
    const data = await res.json();
    if (data.success) {
      localStorage.setItem('authToken', data.token);
      localStorage.setItem('currentUserId', data.userId);
      localStorage.setItem('currentUser', JSON.stringify(data.user));
      location.reload();
    } else {
      alert(data.message);
    }
  }

  function logout() {
    localStorage.clear();
    location.reload();
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BLK Marketplace</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#E74C3C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BLK">
<style>body{margin:0;background:#E74C3C;}</style></head>
<body>
<script>
/* Charge app.html (ton ancien index.html) et lui ajoute blk-fixes.css / blk-fixes.js */
fetch('app.html?v=3', { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (h) {
  h = h.replace('</head>', '<link rel="stylesheet" href="blk-fixes.css?v=3"></head>');
  var i = h.lastIndexOf('</body>');
  h = h.slice(0, i) + '<script src="blk-fixes.js?v=3"><\/script>' + h.slice(i);
  document.open(); document.write(h); document.close();
}).catch(function () {
  document.body.innerHTML = '<p style="padding:30px;color:#fff;font-family:sans-serif">Impossible de charger BLK. Vérifie ta connexion.</p>';
});
</script>
</body></html>
